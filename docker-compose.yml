#===============================================================================
# AI Cluster - Docker Compose Configuration
#===============================================================================
# This file defines all services for the AI Cluster coordinator.
# Run inside LXC 10.10.10.75 (NOT on Proxmox host)
#
# Usage:
#   docker compose up -d      # Start all services
#   docker compose logs -f    # View logs
#   docker compose down       # Stop all services
#===============================================================================

services:
  #-----------------------------------------------------------------------------
  # Redis - Job Queue (with password authentication)
  #-----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai-cluster-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-ai-cluster-redis-secret}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ai-cluster-redis-secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-cluster

  #-----------------------------------------------------------------------------
  # Coordinator - Flask API (with security features)
  #-----------------------------------------------------------------------------
  coordinator:
    build:
      context: ./src/coordinator
      dockerfile: Dockerfile
    container_name: ai-cluster-coordinator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-ai-cluster-redis-secret}
      - DATABASE_URL=sqlite:////data/jobs.db
      - MODELS_PATH=/models
      - RESULTS_PATH=/results
      - PROJECTS_PATH=/projects
      - API_KEY=${API_KEY:-}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - ALLOWED_SUBNET=${ALLOWED_SUBNET:-10.10.10.0/24}
    volumes:
      - ai-cluster-models:/models
      - ai-cluster-results:/results
      - ai-cluster-projects:/projects
      - ai-cluster-db:/data
      - ./src/worker:/worker:ro  # Mount worker scripts for /setup/worker.py endpoint
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ai-cluster

  #-----------------------------------------------------------------------------
  # Frontend - React + Nginx
  #-----------------------------------------------------------------------------
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: ai-cluster-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - coordinator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ai-cluster

#-------------------------------------------------------------------------------
# Networks
#-------------------------------------------------------------------------------
networks:
  ai-cluster:
    driver: bridge

#-------------------------------------------------------------------------------
# Volumes
#-------------------------------------------------------------------------------
volumes:
  redis-data:
  ai-cluster-models:
    name: ai-cluster-models
  ai-cluster-results:
    name: ai-cluster-results
  ai-cluster-projects:
    name: ai-cluster-projects
  ai-cluster-db:
    name: ai-cluster-db
