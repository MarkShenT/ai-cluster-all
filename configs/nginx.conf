#===============================================================================
# AI Cluster - Nginx Configuration
#===============================================================================
# Reverse proxy configuration for the AI Cluster frontend
# - Serves React static files
# - Proxies API requests to Flask coordinator
# - Handles WebSocket connections for real-time updates
#===============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/wasm;

    # File upload size (for project uploads)
    client_max_body_size 100M;

    # Upstream for coordinator
    upstream coordinator {
        server coordinator:5000;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        #-----------------------------------------------------------------------
        # IP Restriction - Only allow 10.10.10.x subnet (Defense in Depth)
        #-----------------------------------------------------------------------
        # Allow local subnet
        allow 10.10.10.0/24;
        # Allow localhost (for Docker internal health checks)
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # Docker internal networks
        # Deny all others
        deny all;

        #-----------------------------------------------------------------------
        # Static Files (React Build)
        #-----------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        #-----------------------------------------------------------------------
        # API Proxy
        #-----------------------------------------------------------------------
        location /api/ {
            proxy_pass http://coordinator/api/;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts (longer for model downloads)
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Buffering (disable for streaming)
            proxy_buffering off;
        }

        #-----------------------------------------------------------------------
        # WebSocket Proxy (Socket.IO)
        #-----------------------------------------------------------------------
        location /socket.io/ {
            proxy_pass http://coordinator/socket.io/;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
        }

        #-----------------------------------------------------------------------
        # Setup Files (Worker Downloads)
        #-----------------------------------------------------------------------
        location /setup/ {
            proxy_pass http://coordinator/setup/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        #-----------------------------------------------------------------------
        # Model Downloads (Large Files)
        #-----------------------------------------------------------------------
        location /models/download/ {
            proxy_pass http://coordinator/models/download/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Long timeout for large model files
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            # Disable buffering for streaming downloads
            proxy_buffering off;
        }

        #-----------------------------------------------------------------------
        # Health Check
        #-----------------------------------------------------------------------
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        #-----------------------------------------------------------------------
        # Error Pages
        #-----------------------------------------------------------------------
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
