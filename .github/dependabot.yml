version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/src/coordinator"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 1
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/src/frontend"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 1
    groups:
      npm-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 1
